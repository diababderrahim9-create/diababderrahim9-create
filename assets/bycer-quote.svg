  <text x="310.0" y="20.0" text-anchor="middle" font-family='Fira Code, Consolas, monospace' font-size="12" fill="#5B6470">bycer@github:~$ ./quote.sh --random</text>

  <text x="310.0" y="90" text-anchor="middle" font-family='Fira Code, Consolas, monospace' font-size="15" fill="#39FF6A" opacity="0">“The quieter you become, the more you are able to hear.”<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2833;0.3333;1" dur="9.0s" begin="0.000s" repeatCount="indefinite"/></text><text x="310.0" y="90" text-anchor="middle" font-family='Fira Code, Consolas, monospace' font-size="15" fill="#39FF6A" opacity="0">“There is no patch for human stupidity.”<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2833;0.3333;1" dur="9.0s" begin="3.000s" repeatCount="indefinite"/></text><text x="310.0" y="90" text-anchor="middle" font-family='Fira Code, Consolas, monospace' font-size="15" fill="#39FF6A" opacity="0">“Security is not a product, but a process.”<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.2833;0.3333;1" dur="9.0s" begin="6.000s" repeatCount="indefinite"/></text>
</svg>
