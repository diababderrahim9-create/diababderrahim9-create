      <text x="2" y="12" font-family='Fira Code, Consolas, monospace' font-size="11" fill="#25BF3C" opacity="0.07">ｸ</text><text x="2" y="25" font-family='Fira Code, Consolas, monospace' font-size="11" fill="#25BF3C" opacity="0.09">0</text><text x="2" y="38" font-family='Fira Code, Consolas, monospace' font-size="11" fill="#25BF3C" opacity="0.09">10</text><text x="2" y="51" font-family='Fira Code, Consolas, monospace' font-size="11" fill="#25BF3C" opacity="0.07">0</text>
